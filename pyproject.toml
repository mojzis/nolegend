[project]
name = "nolegend"
version = "0.1.2"
description = "Tufte-style templates and helpers for Plotly charts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Matous" }]
keywords = ["plotly", "tufte", "visualization", "data-ink", "charts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Visualization",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "plotly>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pytest",
    "pytest-cov",
    "poethepoet",
    "marimo>=0.23.1",
    "plotly>=6.7.0",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "DTZ", "T20", "PTH", "ERA", "PL", "TRY", "RUF", "S", "PERF", "FURB"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLR0913", "PLC0415", "S"]
"nolegend/helpers.py" = ["PLR0913", "PLR2004"]
"examples/**" = ["PLC0415", "T20", "PLR1711"]

[tool.ruff.format]

[tool.ty]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=nolegend --cov-report=term-missing"

[tool.coverage.run]
source = ["nolegend"]

[tool.coverage.report]
show_missing = true

